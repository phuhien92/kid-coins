<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnie — Fantasy Coin Guild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#FBF8EF; --cream-card:#FCFAF3; --ink:#1C1B17; --ink-soft:#5C5A50;
  --green:#2F7A55; --green-dk:#245F42; --green-tint:#CFE7D8;
  --coin:#F4D34E; --coin-dk:#E3BE34;
  --purple:#7B6BE6; --purple-dk:#5E4FCB; --lavpale:#DEE0FA;
  --mint:#C7E9D4; --peach:#F8D3B2; --lemon:#F7E68C; --coral:#F0A6A0; --sky:#CDE7F2;
  --font-d:"Fredoka",system-ui,sans-serif; --font-b:"Nunito",system-ui,sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-b); color: var(--ink);
  background: var(--cream);
  background-image:
    radial-gradient(circle at 12% 14%, rgba(199,202,244,.30), transparent 38%),
    radial-gradient(circle at 88% 10%, rgba(199,233,212,.34), transparent 36%),
    radial-gradient(circle at 82% 92%, rgba(248,211,178,.28), transparent 42%);
  min-height: 100vh; padding: 32px 24px 48px;
}

/* Header */
.hdr { display:flex; align-items:center; gap:10px; margin-bottom: 32px; }
.hdr-logo { font-family:var(--font-d); font-weight:700; font-size:24px; }
.hdr-logo span { color: var(--green); }
.hdr-tag {
  font-family:var(--font-d); font-weight:600; font-size:12px;
  background:var(--lavpale); color:var(--purple-dk);
  border:2px solid var(--ink); border-radius:999px; padding:3px 12px; margin-left:4px;
}
.page-title {
  font-family: var(--font-d); font-weight:700; font-size:30px;
  margin-bottom:6px;
}
.page-sub { font-size:14px; color:var(--ink-soft); margin-bottom:32px; }

/* Color switcher */
.color-bar {
  display:flex; gap:8px; margin-bottom:32px; align-items:center;
}
.color-bar span { font-family:var(--font-d); font-weight:600; font-size:13px; margin-right:4px; }
.swatch {
  width:28px; height:28px; border-radius:50%; border:2.5px solid var(--ink);
  cursor:pointer; transition:transform .15s;
}
.swatch:hover, .swatch.active { transform:scale(1.25); }

/* Grid */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap:16px;
  max-width:1100px;
  margin:0 auto;
}

/* Card */
.card {
  background: var(--cream-card);
  border: 2.5px solid var(--ink);
  border-radius:24px;
  padding:20px 16px 14px;
  display:flex; flex-direction:column; align-items:center;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform .12s, box-shadow .12s;
  cursor:pointer;
}
.card:hover { transform:translateY(-4px); box-shadow: 0 8px 0 var(--ink); }
.card.free-badge { position:relative; }
.card .badge {
  position:absolute; top:10px; right:10px;
  font-size:10px; font-family:var(--font-d); font-weight:600;
  background:var(--green-tint); color:var(--green-dk);
  border:1.5px solid var(--ink); border-radius:999px;
  padding:2px 8px;
}
.card .lock-badge {
  position:absolute; top:10px; right:10px;
  font-size:10px; font-family:var(--font-d); font-weight:600;
  background:var(--lavpale); color:var(--purple-dk);
  border:1.5px solid var(--ink); border-radius:999px;
  padding:2px 8px;
}
.card-name {
  font-family: var(--font-d); font-weight:700; font-size:17px;
  margin-top:10px;
}
.card-xp {
  font-size:11px; color:var(--ink-soft); margin-top:2px;
}

/* Stage bg */
.stage {
  border:2px solid rgba(28,27,23,.10);
  border-radius:16px;
  padding:10px;
  background: var(--sky);
  display:flex; align-items:center; justify-content:center;
}
.char-svg { animation: idle 3s ease-in-out infinite; }
@keyframes idle {
  0%,100% { transform:translateY(0) rotate(-1deg); }
  50% { transform:translateY(-6px) rotate(1deg); }
}
/* stagger idle animation so each card has unique phase */
.card:nth-child(2) .char-svg { animation-delay:-.3s; }
.card:nth-child(3) .char-svg { animation-delay:-.7s; }
.card:nth-child(4) .char-svg { animation-delay:-1.1s; }
.card:nth-child(5) .char-svg { animation-delay:-1.5s; }
.card:nth-child(6) .char-svg { animation-delay:-.9s; }
.card:nth-child(7) .char-svg { animation-delay:-.4s; }
.card:nth-child(8) .char-svg { animation-delay:-1.8s; }
.card:nth-child(9) .char-svg { animation-delay:-.6s; }
.card:nth-child(10) .char-svg { animation-delay:-2.1s; }
.card:nth-child(11) .char-svg { animation-delay:-1.3s; }
.card:nth-child(12) .char-svg { animation-delay:-.2s; }
.card:nth-child(13) .char-svg { animation-delay:-1.7s; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">earnie<span>.</span></div>
  <span class="hdr-tag">Fantasy Coin Guild</span>
</div>

<h1 class="page-title">Choose your class</h1>
<p class="page-sub">Each outfit unlocks as you earn XP. Wizard is free for everyone.</p>

<div class="color-bar">
  <span>Color:</span>
  <div class="swatch active" style="background:#F4D34E" data-color="#F4D34E" title="Yellow"></div>
  <div class="swatch" style="background:#C7E9D4" data-color="#C7E9D4" title="Mint"></div>
  <div class="swatch" style="background:#CDE7F2" data-color="#CDE7F2" title="Sky"></div>
  <div class="swatch" style="background:#F8D3B2" data-color="#F8D3B2" title="Peach"></div>
  <div class="swatch" style="background:#F0A6A0" data-color="#F0A6A0" title="Coral"></div>
  <div class="swatch" style="background:#DEE0FA" data-color="#DEE0FA" title="Lavender"></div>
</div>

<div class="grid" id="grid"></div>

<script>
const INK = "#1C1B17";
const OUTFITS = [
  { value:"none",        label:"No Class",   xp:null },
  { value:"wizard",      label:"Wizard",     xp:null },
  { value:"knight",      label:"Knight",     xp:300 },
  { value:"elf",         label:"Elf",        xp:300 },
  { value:"dwarf",       label:"Dwarf",      xp:500 },
  { value:"ranger",      label:"Ranger",     xp:400 },
  { value:"thief",       label:"Thief",      xp:400 },
  { value:"alchemist",   label:"Alchemist",  xp:500 },
  { value:"monk",        label:"Monk",       xp:600 },
  { value:"bard",        label:"Bard",       xp:600 },
  { value:"shaman",      label:"Shaman",     xp:700 },
  { value:"orc",         label:"Orc",        xp:700 },
  { value:"necromancer", label:"Necromancer",xp:900 },
];

let currentColor = "#F4D34E";

function base(fill) {
  return `
  <!-- Legs -->
  <line x1="51" y1="90" x2="44" y2="113" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="69" y1="90" x2="76" y2="113" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="41" cy="114" rx="8" ry="4.5" fill="${INK}"/>
  <ellipse cx="79" cy="114" rx="8" ry="4.5" fill="${INK}"/>
  <!-- Arms -->
  <line x1="22" y1="60" x2="36" y2="67" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="84" y1="67" x2="98" y2="60" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Coin -->
  <circle cx="60" cy="54" r="38" fill="${fill}" stroke="${INK}" stroke-width="3"/>
  <circle cx="60" cy="54" r="30" fill="${INK}" fill-opacity="0.10" stroke="${INK}" stroke-width="1.5"/>
  <!-- Cheeks -->
  <ellipse cx="41" cy="62" rx="7.5" ry="4.5" fill="#F0A6A0" opacity="0.60"/>
  <ellipse cx="79" cy="62" rx="7.5" ry="4.5" fill="#F0A6A0" opacity="0.60"/>`;
}

function defaultEyes() {
  return `
  <circle cx="50" cy="50" r="5.5" fill="${INK}"/>
  <circle cx="70" cy="50" r="5.5" fill="${INK}"/>
  <circle cx="51.8" cy="48.2" r="2" fill="white"/>
  <circle cx="71.8" cy="48.2" r="2" fill="white"/>`;
}

function defaultMouth() {
  return `<path d="M49 66 Q60 76 71 66" stroke="${INK}" stroke-width="2.5" stroke-linecap="round" fill="none"/>`;
}

function monkBeads() {
  let s = '';
  for (let i = 0; i < 11; i++) {
    const angle = (i / 11) * Math.PI * 2 - Math.PI / 2;
    const bx = (14 + Math.cos(angle) * 10).toFixed(2);
    const by = (75 + Math.sin(angle) * 10).toFixed(2);
    s += `<circle cx="${bx}" cy="${by}" r="2.5" fill="#92400E" stroke="${INK}" stroke-width="0.8"/>`;
  }
  return s;
}

function renderSVG(outfit, fill) {
  let inner = '';
  const hasOutfit = outfit !== 'none';

  // Behind-coin layer
  if (outfit === 'thief') {
    inner += `<path d="M38,30 Q32,54 34,80 Q45,88 60,90 Q75,88 86,80 Q88,54 82,30 Q60,22 38,30Z" fill="#1E2A4A" opacity="0.85"/>`;
  } else if (outfit === 'ranger') {
    inner += `<path d="M40,28 Q34,54 36,82 Q48,90 60,91 Q72,90 84,82 Q86,54 80,28 Q60,18 40,28Z" fill="#2D5016" opacity="0.85"/>`;
  } else if (outfit === 'monk') {
    inner += `<path d="M22,58 Q18,70 24,84 Q35,96 60,98 Q85,96 96,84 Q102,70 98,58 Q80,50 60,50 Q40,50 22,58Z" fill="#D97706" opacity="0.90"/>`;
  } else if (outfit === 'necromancer') {
    inner += `<path d="M32,26 Q20,54 22,85 Q38,98 60,100 Q82,98 98,85 Q100,54 88,26 Q60,12 32,26Z" fill="#111827" opacity="0.92"/>`;
  }

  inner += base(fill);

  // Face overlays
  if (outfit === 'dwarf') {
    inner += `
    <path d="M38,62 Q36,78 40,86 Q50,96 60,97 Q70,96 80,86 Q84,78 82,62 Q70,58 60,58 Q50,58 38,62Z" fill="#8B4513" stroke="${INK}" stroke-width="1.5"/>
    <path d="M44,65 Q44,80 48,88" stroke="#A0522D" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M54,63 Q52,79 54,89" stroke="#A0522D" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M66,63 Q68,79 66,89" stroke="#A0522D" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M76,65 Q76,80 72,88" stroke="#A0522D" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  } else if (outfit === 'orc') {
    inner += `
    <path d="M46,72 Q42,82 44,88 Q48,94 52,90 Q54,84 50,76Z" fill="#F5F0E8" stroke="${INK}" stroke-width="1.5"/>
    <path d="M74,72 Q78,82 76,88 Q72,94 68,90 Q66,84 70,76Z" fill="#F5F0E8" stroke="${INK}" stroke-width="1.5"/>`;
  } else if (outfit === 'necromancer') {
    inner += `<circle cx="60" cy="54" r="30" fill="#111827" fill-opacity="0.18"/>`;
  } else if (outfit === 'alchemist') {
    inner += `
    <circle cx="50" cy="50" r="8" fill="#D6B68A" stroke="${INK}" stroke-width="2"/>
    <circle cx="70" cy="50" r="8" fill="#D6B68A" stroke="${INK}" stroke-width="2"/>
    <line x1="58" y1="50" x2="62" y2="50" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
    <path d="M32,48 Q40,44 42,50" stroke="${INK}" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M78,50 Q80,44 88,48" stroke="${INK}" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  }

  // Eyes
  if (outfit === 'monk') {
    inner += `
    <path d="M44,50 Q50,45 56,50" stroke="${INK}" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M64,50 Q70,45 76,50" stroke="${INK}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  } else {
    inner += defaultEyes();
  }

  // Necromancer eye glow
  if (outfit === 'necromancer') {
    inner += `
    <circle cx="50" cy="50" r="7" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.85"/>
    <circle cx="70" cy="50" r="7" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.85"/>`;
  }

  // Mouth (suppressed for dwarf beard)
  if (outfit !== 'dwarf') {
    inner += defaultMouth();
  }

  // Hat (only when no outfit)
  if (!hasOutfit) {
    // No hat for the gallery (cleaner)
  }

  // === Headgear ===
  if (outfit === 'knight') {
    inner += `
    <ellipse cx="60" cy="22" rx="26" ry="22" fill="#9CA3AF" stroke="${INK}" stroke-width="2"/>
    <rect x="34" y="22" width="8" height="18" rx="3" fill="#9CA3AF" stroke="${INK}" stroke-width="1.5"/>
    <rect x="78" y="22" width="8" height="18" rx="3" fill="#9CA3AF" stroke="${INK}" stroke-width="1.5"/>
    <rect x="42" y="24" width="36" height="8" rx="2" fill="${INK}" fill-opacity="0.75"/>
    <path d="M48,10 Q55,6 62,8" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M58,2 Q54,-4 50,2 Q55,6 60,0Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
    <path d="M60,0 Q62,-4 64,2 Q60,6 60,0Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
    <path d="M62,2 Q66,-4 70,2 Q65,6 60,0Z" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>`;
  } else if (outfit === 'wizard') {
    inner += `
    <ellipse cx="60" cy="30" rx="30" ry="7" fill="#5B21B6" stroke="${INK}" stroke-width="2"/>
    <path d="M34,30 Q38,10 60,2 Q82,10 86,30Z" fill="#7C3AED" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M34,30 Q60,24 86,30" stroke="#4C1D95" stroke-width="3" fill="none"/>
    <circle cx="55" cy="16" r="2.5" fill="#FCD34D"/>
    <circle cx="66" cy="12" r="2" fill="#FCD34D"/>
    <circle cx="72" cy="22" r="1.8" fill="#FCD34D"/>
    <circle cx="48" cy="23" r="1.8" fill="#FCD34D"/>
    <circle cx="60" cy="3" r="3" fill="#FCD34D" opacity="0.9"/>`;
  } else if (outfit === 'elf') {
    inner += `
    <path d="M22,46 Q16,38 20,30 Q26,34 28,42Z" fill="${fill}" stroke="${INK}" stroke-width="1.5"/>
    <path d="M98,46 Q104,38 100,30 Q94,34 92,42Z" fill="${fill}" stroke="${INK}" stroke-width="1.5"/>
    <path d="M36,24 Q44,18 52,22" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="38" cy="22" rx="5" ry="3" fill="#65A30D" stroke="#4D7C0F" stroke-width="1" transform="rotate(-20,38,22)"/>
    <ellipse cx="44" cy="18" rx="5" ry="3" fill="#65A30D" stroke="#4D7C0F" stroke-width="1" transform="rotate(-10,44,18)"/>
    <ellipse cx="51" cy="20" rx="5" ry="3" fill="#65A30D" stroke="#4D7C0F" stroke-width="1" transform="rotate(10,51,20)"/>
    <path d="M84,24 Q76,18 68,22" stroke="#4D7C0F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="82" cy="22" rx="5" ry="3" fill="#65A30D" stroke="#4D7C0F" stroke-width="1" transform="rotate(20,82,22)"/>
    <ellipse cx="76" cy="18" rx="5" ry="3" fill="#65A30D" stroke="#4D7C0F" stroke-width="1" transform="rotate(10,76,18)"/>
    <ellipse cx="69" cy="20" rx="5" ry="3" fill="#65A30D" stroke="#4D7C0F" stroke-width="1" transform="rotate(-10,69,20)"/>
    <circle cx="60" cy="18" r="4" fill="#FCD34D" stroke="#D97706" stroke-width="1.5"/>`;
  } else if (outfit === 'dwarf') {
    inner += `
    <ellipse cx="60" cy="20" rx="26" ry="20" fill="#6B7280" stroke="${INK}" stroke-width="2"/>
    <path d="M36,24 Q26,10 30,2 Q34,8 38,18Z" fill="#9CA3AF" stroke="${INK}" stroke-width="1.5"/>
    <path d="M84,24 Q94,10 90,2 Q86,8 82,18Z" fill="#9CA3AF" stroke="${INK}" stroke-width="1.5"/>
    <rect x="34" y="34" width="52" height="6" rx="3" fill="#6B7280" stroke="${INK}" stroke-width="1.5"/>
    <circle cx="44" cy="18" r="2.5" fill="#9CA3AF" stroke="${INK}" stroke-width="1"/>
    <circle cx="60" cy="12" r="2.5" fill="#9CA3AF" stroke="${INK}" stroke-width="1"/>
    <circle cx="76" cy="18" r="2.5" fill="#9CA3AF" stroke="${INK}" stroke-width="1"/>
    <path d="M46,8 Q54,4 62,6" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>`;
  } else if (outfit === 'ranger') {
    inner += `
    <path d="M32,28 Q34,14 60,10 Q86,14 88,28 Q80,22 60,20 Q40,22 32,28Z" fill="#365314" stroke="${INK}" stroke-width="1.5"/>
    <path d="M32,28 Q28,40 30,52 Q36,50 36,38 Q44,30 60,28 Q76,30 84,38 Q84,50 90,52 Q92,40 88,28 Q76,22 60,22 Q44,22 32,28Z" fill="#4D7C0F" stroke="${INK}" stroke-width="2"/>
    <path d="M36,38 Q38,26 60,24 Q82,26 84,38" stroke="#65A30D" stroke-width="1.5" fill="none"/>`;
  } else if (outfit === 'thief') {
    inner += `
    <path d="M30,26 Q26,40 28,54 Q34,52 34,40 Q42,28 60,26 Q78,28 86,40 Q86,52 92,54 Q94,40 90,26 Q76,18 60,18 Q44,18 30,26Z" fill="#1E2A4A" stroke="${INK}" stroke-width="2"/>
    <ellipse cx="60" cy="44" rx="22" ry="12" fill="#0F172A" fill-opacity="0.25"/>
    <path d="M36,40 Q40,28 60,26 Q80,28 84,40" stroke="#374151" stroke-width="1.5" fill="none"/>`;
  } else if (outfit === 'alchemist') {
    inner += `
    <path d="M44,72 Q60,68 76,72" stroke="#92400E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="46" y="73" width="28" height="14" rx="3" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>`;
  } else if (outfit === 'monk') {
    inner += `
    <path d="M46,80 Q60,76 74,80 Q70,90 60,92 Q50,90 46,80Z" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <path d="M56,80 Q60,84 64,80" stroke="#92400E" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  } else if (outfit === 'bard') {
    inner += `
    <ellipse cx="60" cy="24" rx="38" ry="8" fill="#7F1D1D" stroke="${INK}" stroke-width="2"/>
    <path d="M34,24 Q36,6 60,4 Q84,6 86,24Z" fill="#991B1B" stroke="${INK}" stroke-width="2"/>
    <path d="M34,24 Q60,18 86,24" stroke="#B45309" stroke-width="2.5" fill="none"/>
    <path d="M82,20 Q96,10 100,0 Q92,4 88,14 Q90,8 88,4 Q84,12 82,20Z" fill="#D97706" stroke="#92400E" stroke-width="1"/>`;
  } else if (outfit === 'shaman') {
    inner += `
    <rect x="36" y="24" width="48" height="8" rx="3" fill="#92400E" stroke="${INK}" stroke-width="1.5"/>
    <path d="M60,24 Q56,8 58,0 Q60,6 62,0 Q64,8 60,24Z" fill="#F5F5F4" stroke="#A8A29E" stroke-width="1"/>
    <path d="M52,26 Q44,12 42,4 Q46,10 50,6 Q52,14 52,26Z" fill="#D6D3D1" stroke="#A8A29E" stroke-width="1"/>
    <path d="M44,26 Q34,14 30,8 Q36,12 40,10 Q42,18 44,26Z" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
    <path d="M68,26 Q76,12 78,4 Q74,10 70,6 Q68,14 68,26Z" fill="#D6D3D1" stroke="#A8A29E" stroke-width="1"/>
    <path d="M76,26 Q86,14 90,8 Q84,12 80,10 Q78,18 76,26Z" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
    <path d="M58,2 Q60,0 62,2" stroke="${INK}" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M42,6 Q44,4 46,6" stroke="${INK}" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M78,4 Q76,2 74,4" stroke="${INK}" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="28" r="4" fill="#F5F5F4" stroke="${INK}" stroke-width="1.5"/>
    <circle cx="58.5" cy="27" r="1" fill="${INK}"/>
    <circle cx="61.5" cy="27" r="1" fill="${INK}"/>
    <path d="M58,30 Q60,32 62,30" stroke="${INK}" stroke-width="1" stroke-linecap="round" fill="none"/>`;
  } else if (outfit === 'orc') {
    inner += `
    <path d="M52,18 Q50,6 54,0 Q56,8 56,16Z" fill="#374151" stroke="${INK}" stroke-width="1"/>
    <path d="M57,16 Q56,4 60,0 Q64,4 63,16Z" fill="#1F2937" stroke="${INK}" stroke-width="1"/>
    <path d="M62,16 Q64,4 68,0 Q68,8 66,16Z" fill="#374151" stroke="${INK}" stroke-width="1"/>
    <path d="M46,20 Q46,10 50,6 Q50,14 50,20Z" fill="#4B5563" stroke="${INK}" stroke-width="1"/>
    <path d="M70,20 Q70,10 74,6 Q72,14 70,20Z" fill="#4B5563" stroke="${INK}" stroke-width="1"/>`;
  } else if (outfit === 'necromancer') {
    inner += `
    <path d="M32,26 Q28,36 30,48 Q36,46 36,36 Q44,26 60,24 Q76,26 84,36 Q84,46 90,48 Q92,36 88,26 Q76,16 60,16 Q44,16 32,26Z" fill="#1F2937" stroke="${INK}" stroke-width="2"/>

  if (outfit === 'knight') {
    inner += `
    <!-- Sword -->

  } else if (outfit === 'wizard') {

    <rect x="10" y="32" width="4" height="58" rx="2" fill="#92400E" stroke="${INK}" stroke-width="1.5"/>

    <rect x="8" y="44" width="10" height="22" rx="3" fill="#92400E" stroke="${INK}" stroke-width="1.5"/>
    <line x1="10" y1="46" x2="10" y2="60" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13" y1="44" x2="13" y2="58" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round"/>`;
  } else if (outfit === 'dwarf') {
    inner += `
    <rect x="10" y="56" width="4" height="36" rx="2" fill="#92400E" stroke="${INK}" stroke-width="1.5"/>
    <rect x="4" y="44" width="16" height="20" rx="3" fill="#6B7280" stroke="${INK}" stroke-width="2"/>
    <rect x="6" y="46" width="12" height="4" rx="1" fill="#9CA3AF" opacity="0.6"/>`;
  } else if (outfit === 'ranger') {
    inner += `
    <path d="M96,36 Q108,56 96,76" stroke="#92400E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="96" y1="36" x2="96" y2="76" stroke="#D6D3D1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2"/>
    <line x1="22" y1="56" x2="96" y2="56" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>

    inner += `
    <rect x="10" y="44" width="3.5" height="20" rx="1.5" fill="#D1D5DB" stroke="${INK}" stroke-width="1.2"/>
    <rect x="7" y="60" width="10" height="3" rx="1.5" fill="#1F2937" stroke="${INK}" stroke-width="1"/>
    <rect x="9" y="63" width="5" height="8" rx="1" fill="#374151" stroke="${INK}" stroke-width="1"/>`;
  } else if (outfit === 'alchemist') {
    inner += `
    <!-- Flask -->
    <path d="M96,62 Q90,64 90,72 Q90,80 96,82 Q102,80 102,72 Q102,64 96,62Z" fill="#6EE7B7" stroke="${INK}" stroke-width="1.5"/>
    <rect x="93" y="52" width="6" height="12" rx="2" fill="#D6D3D1" stroke="${INK}" stroke-width="1.5"/>
    <circle cx="96" cy="52" r="3" fill="#F5F5F4" stroke="${INK}" stroke-width="1"/>

    <rect x="12" y="50" width="5" height="22" rx="2.5" fill="#FDE68A" stroke="${INK}" stroke-width="1.5"/>

  } else if (outfit === 'monk') {
    inner += monkBeads();
    inner += `
    <line x1="14" y1="86" x2="14" y2="95" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="90" x2="18" y2="90" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>`;
  } else if (outfit === 'bard') {
    inner += `
    <!-- Lute -->
    <path d="M94,60 Q88,56 86,64 Q86,74 92,78 Q98,74 98,64 Q96,56 94,60Z" fill="#D97706" stroke="${INK}" stroke-width="1.5"/>

    <text x="106" y="42" font-size="8" fill="#7C3AED" opacity="0.7">♩</text>`;
  } else if (outfit === 'shaman') {
    inner += `
    <rect x="8" y="60" width="4" height="24" rx="2" fill="#92400E" stroke="${INK}" stroke-width="1.5"/>

    <circle cx="12" cy="54" r="1.5" fill="#FCD34D"/>
    <circle cx="7" cy="56" r="1.5" fill="#FCD34D"/>`;
  } else if (outfit === 'orc') {
    inner += `
    <rect x="94" y="54" width="4" height="34" rx="2" fill="#92400E" stroke="${INK}" stroke-width="1.5"/>
    <path d="M92,38 Q86,42 88,54 Q94,58 100,54 Q104,44 98,38Z" fill="#6B7280" stroke="${INK}" stroke-width="2"/>
    <path d="M90,42 Q88,48 90,52" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" fill="none"/>`;
  } else if (outfit === 'necromancer') {
    inner += `
    <rect x="8" y="36" width="4" height="58" rx="2" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <circle cx="10" cy="32" r="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/>
    <circle cx="7.5" cy="30" r="1.8" fill="#6B7280"/>
    <circle cx="12.5" cy="30" r="1.8" fill="#6B7280"/>
    <path d="M7,34 Q10,36 13,34" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M7,34 L7,36 M10,35 L10,37 M13,34 L13,36" stroke="#6B7280" stroke-width="1" stroke-linecap="round"/>`;
  }

  return `<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

// BG colors per outfit for the stage
const STAGE_BG = {
  none: '#CDE7F2', wizard: '#DEE0FA', knight: '#E5E7EB',
  elf: '#C7E9D4', dwarf: '#E5E7EB', ranger: '#C7E9D4',
  thief: '#374151', alchemist: '#FDE68A', monk: '#FED7AA',
  bard: '#FCE7F3', shaman: '#FEF3C7', orc: '#D1FAE5',
  necromancer: '#1F2937',
};
const STAGE_TEXT = {
  thief: '#F9FAFB', necromancer: '#F9FAFB',
};

function renderGrid(color) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  OUTFITS.forEach(({ value, label, xp }) => {
    const isFree = xp === null;
    const bg = STAGE_BG[value] || '#CDE7F2';
    const card = document.createElement('div');
    card.className = 'card' + (isFree ? ' free-badge' : '');
    card.innerHTML = `
      ${isFree ? `<span class="badge">Free</span>` : `<span class="lock-badge">🔒 ${xp} XP</span>`}
      <div class="stage" style="background:${bg}; width:100%">
        <div class="char-svg">${renderSVG(value, color)}</div>
      </div>
      <div class="card-name">${label}</div>
      ${xp ? `<div class="card-xp">${xp} XP to unlock</div>` : ''}
    `;
    grid.appendChild(card);
  });
}

// Init
renderGrid(currentColor);

// Color switcher
document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    currentColor = sw.dataset.color;
    renderGrid(currentColor);
  });
});
</script>
